services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memecoin
      POSTGRES_PASSWORD: memecoin
      POSTGRES_DB: memecoin_intelligence
    ports:
      - "5432:5432"
    volumes:
      - mi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memecoin -d memecoin_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://memecoin:memecoin@postgres:5432/memecoin_intelligence
      DATABASE_URL_SYNC: postgresql://memecoin:memecoin@postgres:5432/memecoin_intelligence
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  mi_pg:
