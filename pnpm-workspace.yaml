allowBuilds:
  '@prisma/client': false
  '@prisma/engines': false
  esbuild: false
  prisma: false
  sharp: false
  unrs-resolver: false
# Allow native/postinstall build scripts to run (needed on Vercel too).
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
